<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>물음판</title>
<style>
  /* 글자 크기는 한 곳에서만 정한다. 확대/축소가 이 한 값을 바꾼다. */
  :root { font-size: 15px;
          --글: #1a1a1a; --흐림: #6b6b6b; --선: #e0ddd6; --바탕: #faf9f6;
          --맞: #2d7a4f; --틀: #b4453c; --미지: #8a7f6d; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--바탕); color: var(--글);
         font: 1rem/1.65 -apple-system, "Segoe UI", "Malgun Gothic", sans-serif;
         display: flex; flex-direction: column; overflow: hidden; }

  /* 머리 · 입력 · 발치는 고정. 가운데 타래만 스크롤한다 — 한 페이지 안이다. */
  .머리 { flex: none; padding: 0.9rem 1.2rem 0.7rem; border-bottom: 1px solid var(--선);
          background: #fff; }
  .줄1 { display: flex; align-items: baseline; gap: 0.7rem; }
  h1 { font-size: 1.15rem; margin: 0; font-weight: 600; }
  .얼개 { color: var(--흐림); font-size: 0.82rem; flex: 1;
          white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .얼개 b { color: var(--글); font-weight: 600; }
  .돋보기 { flex: none; display: flex; gap: 0.25rem; }
  .돋보기 button { padding: 0.1rem 0.5rem; font-size: 0.85rem; line-height: 1.4; }

  .줄 { display: flex; gap: 0.5rem; margin-top: 0.7rem; }
  input { flex: 1; padding: 0.6rem 0.8rem; border: 1px solid var(--선);
          border-radius: 0.45rem; font: inherit; background: #fff; min-width: 0; }
  input:focus { outline: 2px solid #c9c3b4; outline-offset: -1px; }
  button { padding: 0.6rem 1.1rem; border: 1px solid var(--선); background: #fff;
           border-radius: 0.45rem; font: inherit; cursor: pointer; color: inherit; }
  button:hover { background: #f2efe8; }
  button:disabled { opacity: .45; cursor: default; }

  .타래 { flex: 1; min-height: 0; overflow-y: auto; padding: 0.9rem 1.2rem; }
  .턴 { border: 1px solid var(--선); border-radius: 0.6rem; background: #fff;
        padding: 0.8rem 0.95rem; margin-bottom: 0.7rem; }
  .물음 { font-weight: 600; margin-bottom: 0.5rem; }

  /* 답이 길면(표·코드가 통째로 들어온다) 접어 둔다. 접힌 채로도 무슨
     이야기인지 보이고, 필요하면 펼친다. 이것이 없으면 답 하나가 화면을
     통째로 밀어낸다 — 실제로 그랬다. */
  .답 { white-space: pre-wrap; overflow-wrap: anywhere;
        max-height: 7.5em; overflow: hidden; position: relative; }
  .턴.펼침 .답 { max-height: none; }
  .답::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0;
               height: 1.8em; pointer-events: none;
               background: linear-gradient(transparent, #fff); }
  .턴.펼침 .답::after, .턴.짧음 .답::after { display: none; }

  .꼬리 { margin-top: 0.65rem; padding-top: 0.55rem; border-top: 1px solid var(--선);
          font-size: 0.8rem; color: var(--흐림); display: flex;
          align-items: center; gap: 0.55rem; flex-wrap: wrap; }
  .딱지 { font-size: 0.75rem; padding: 0.1rem 0.5rem; border-radius: 0.7rem;
          background: #efece4; color: var(--흐림); font-weight: 600; }
  .딱지.설명 { background: #e3efe7; color: var(--맞); }
  .딱지.미지 { background: #f0ece2; color: var(--미지); }
  .꼬리 .틈 { flex: 1; }
  .꼬리 button { padding: 0.2rem 0.7rem; font-size: 0.8rem; border-radius: 0.35rem; }
  .꼬리 button.골름 { background: var(--글); color: #fff; border-color: var(--글); }

  .발치 { flex: none; background: #fff; border-top: 1px solid var(--선);
          padding: 0.5rem 1.2rem; font-size: 0.8rem; color: var(--흐림);
          text-align: center; }
  .탈 { color: var(--틀); }
</style>

<div class="머리">
  <div class="줄1">
    <h1>물음판</h1>
    <div class="얼개" id="얼개">읽는 중 …</div>
    <div class="돋보기">
      <button id="작게" title="축소">−</button>
      <button id="본디" title="본디 크기">100%</button>
      <button id="크게" title="확대">+</button>
    </div>
  </div>
  <div class="줄">
    <input id="칸" placeholder="아무거나 물어보십시오" autofocus autocomplete="off">
    <button id="단추">묻기</button>
  </div>
</div>

<div class="타래" id="타래"></div>
<div class="발치" id="셈">—</div>

<script>
const 칸 = document.getElementById("칸");
const 단추 = document.getElementById("단추");
const 타래 = document.getElementById("타래");

/* 확대·축소. 뿌리 글자 크기 하나만 바꾸면 rem 을 쓴 모든 것이 같이 움직인다.
   브라우저 자체 확대와 달리 가로 폭은 그대로라 한 페이지 안에 머문다. */
let 배 = 15;
try { 배 = parseFloat(localStorage.getItem("물음판배") || "15"); } catch (e) {}
function 배쓰기(v) {
  배 = Math.min(24, Math.max(10, v));
  document.documentElement.style.fontSize = 배 + "px";
  try { localStorage.setItem("물음판배", 배); } catch (e) {}
}
배쓰기(배);
document.getElementById("작게").onclick = () => 배쓰기(배 - 1);
document.getElementById("크게").onclick = () => 배쓰기(배 + 1);
document.getElementById("본디").onclick = () => 배쓰기(15);
addEventListener("keydown", e => {
  if (!(e.ctrlKey || e.metaKey)) return;
  if (e.key === "-") { 배쓰기(배 - 1); e.preventDefault(); }
  if (e.key === "=" || e.key === "+") { 배쓰기(배 + 1); e.preventDefault(); }
  if (e.key === "0") { 배쓰기(15); e.preventDefault(); }
});

function 셈쓰기(s) {
  document.getElementById("셈").textContent =
    `물음 ${s.전체}개 · 맞음 ${s.맞음} · 틀림 ${s.틀림} · 안 본 것 ${s.안봄}` +
    (s.맞음 + s.틀림 ? ` · 적중 ${Math.round(100 * s.맞음 / (s.맞음 + s.틀림))}%` : "");
}

fetch("/info").then(r => r.json()).then(d => {
  document.getElementById("얼개").innerHTML =
    `<b>${d.이름}</b> · 노드 ${d.노드.toLocaleString()} · 엣지 ${d.엣지.toLocaleString()}` +
    ` · 어휘 ${d.어휘.toLocaleString()} · ${d.인코더}`;
  셈쓰기(d.셈);
});

async function 표하기(단추들, 표) {
  const r = await (await fetch("/mark", {
    method: "POST", headers: {"Content-Type": "application/json"},
    body: JSON.stringify({표})
  })).json();
  if (r.탈) return;
  단추들.forEach(b => b.classList.toggle("골름", b.dataset.표 === 표));
  셈쓰기(r.셈);
}

async function 묻기() {
  const q = 칸.value.trim();
  if (!q) return;
  단추.disabled = true; 칸.value = "";
  const 칩 = document.createElement("div");
  칩.className = "턴";
  칩.innerHTML = `<div class="물음"></div><div class="답">…</div>`;
  칩.querySelector(".물음").textContent = q;
  타래.prepend(칩);
  타래.scrollTop = 0;
  try {
    const d = await (await fetch("/ask", {
      method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({질문: q})
    })).json();
    const 답칸 = 칩.querySelector(".답");
    if (d.탈) {
      답칸.innerHTML = `<span class="탈">${d.탈}</span>`;
      칩.classList.add("짧음");
    } else {
      답칸.textContent = d.답;
      const 꼬리 = document.createElement("div");
      꼬리.className = "꼬리";
      꼬리.innerHTML =
        `<span class="딱지 ${d.판정}">${d.판정}</span>` +
        (d.주제 ? `<span>주제 ${d.주제}</span>` : "") +
        `<span>${d.밀리초}ms</span><span class="틈"></span>`;
      // 접혀 있을 때만 펼치기 단추를 붙인다. 짧은 답에 단추가 붙으면 군더더기다.
      if (답칸.scrollHeight > 답칸.clientHeight + 2) {
        const 펼 = document.createElement("button");
        펼.textContent = "펼치기";
        펼.onclick = () => {
          칩.classList.toggle("펼침");
          펼.textContent = 칩.classList.contains("펼침") ? "접기" : "펼치기";
        };
        꼬리.appendChild(펼);
      } else {
        칩.classList.add("짧음");
      }
      for (const 표 of ["맞음", "틀림"]) {
        const b = document.createElement("button");
        b.textContent = 표; b.dataset.표 = 표;
        꼬리.appendChild(b);
      }
      const 단추들 = [...꼬리.querySelectorAll("button[data-표]")];
      단추들.forEach(b => b.onclick = () => 표하기(단추들, b.dataset.표));
      칩.appendChild(꼬리);
      셈쓰기(d.셈);
    }
  } catch (e) {
    칩.querySelector(".답").innerHTML = `<span class="탈">${e}</span>`;
    칩.classList.add("짧음");
  }
  단추.disabled = false; 칸.focus();
}

단추.onclick = 묻기;
칸.onkeydown = e => { if (e.key === "Enter") 묻기(); };
</script>
