name: mco package

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install build twine pytest pytest-xdist numpy
          pip install -e .
      - name: Test the package
        env:
          KG_ENCODER: 문자
        run: python -m pytest -q -n 0 tests/test_mco_package.py
      - name: Check the release tag matches the package version
        if: github.event_name == 'release'
        run: |
          version="$(python -c 'import mco._version as v; print(v.__version__)')"
          tag="${{ github.event.release.tag_name }}"
          test "$tag" = "mco-v$version" || { echo "tag $tag is not mco-v$version"; exit 1; }
      - name: Build
        # Run from outside the checkout: the repository's own build.py shadows the build tool.
        run: |
          cd /tmp
          python -m build --outdir "$GITHUB_WORKSPACE/pkg" "$GITHUB_WORKSPACE"
          python -m twine check "$GITHUB_WORKSPACE"/pkg/*
      - uses: actions/upload-artifact@v4
        with:
          name: package
          path: pkg/

  publish:
    needs: build
    if: github.event_name == 'release' && startsWith(github.event.release.tag_name, 'mco-v')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/mco
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: package
          path: pkg/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: pkg/
